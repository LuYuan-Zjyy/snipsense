name: Feature request
description: Suggest a provider, interaction or prompt improvement
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the reading workflow, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider / model support
        - Selection and trigger behaviour
        - Card UI
        - Prompt / explanation quality
        - Privacy / security
        - Other
